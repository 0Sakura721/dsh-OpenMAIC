# The row mounts lib/index.js as the Host half. `dsh.client` in package.json
# makes the web app load ./lib/client.js as the browser half, which registers
# the sidebar entry, the main panel and the settings card.
#
# Install from a workspace checkout:
#   plugin_manager install_bundle -> <absolute path to this directory>
# ============================================================================

